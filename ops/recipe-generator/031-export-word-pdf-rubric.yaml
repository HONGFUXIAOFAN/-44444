---
rule_id: "031-export-word-pdf"
version: "0.1.0"
description: "031-导出Word/PDF 产出物Rubric评分标准——格式规范性(0.40)/内容完整性(0.35)/可打印性(0.25)"
---
scale:
  levels:
    - "none(0.0)"
    - "weak(0.25)"
    - "partial(0.5)"
    - "good(0.75)"
    - "excellent(1.0)"
aggregation:
  method: "weighted_mean"
  dimension_min: 0.75
  q_threshold: 0.85
rubric:
- key: "format_compliance"
  name: "格式规范性"
  weight: 0.40
  checks:
  - id: "format_typography"
    desc: "字体字号严格符合排版规范"
    evidence_from:
      - "rules/031-export-word-pdf.md:步骤2 字体与可读性"
    levels:
      0.0: "字体字号完全不符合规范（如正文小于14pt）"
      0.25: "仅部分文本符合规范，标题或表格字号偏差明显"
      0.50: "主要字号正确但部分层级（如速查卡/表格注释）字号不符"
      0.75: "字体字号全部正确但行距/段落间距存在偏差"
      1.0: "字体字号100%符合规范：封面28pt/一级24pt/二级20pt/正文16pt/表格14pt/速查卡12-13pt，行距正文1.2/表格1.0"
  - id: "format_color_scheme"
    desc: "表格配色方案统一：暗红表头+交替行"
    evidence_from:
      - "rules/031-export-word-pdf.md:步骤2 表格配色方案"
    levels:
      0.0: "未使用指定配色方案，使用了随机颜色或默认配色"
      0.25: "表头颜色正确但数据行无交替背景色"
      0.50: "配色方案应用但颜色代码不符规范（如红色非#C62828）"
      0.75: "配色方案全部正确但速查卡底色不符合#FFF5F0"
      1.0: "配色100%规范：暗红#C62828表头白字 + 白底#FFF0F0交替 + 正文#333333 + 强调#C62828 + 速查卡底色#FFF5F0"
  - id: "format_column_layout"
    desc: "表格列宽智能分配 + 单元格内边距紧凑规则"
    evidence_from:
      - "rules/031-export-word-pdf.md:步骤2 表格排版规则"
    levels:
      0.0: "未做列宽分配，所有列等宽或默认宽度"
      0.25: "有列宽分配但不符合智能分配规则（如说明列过窄）"
      0.50: "列宽基本合理但个别标注列宽度超标（如序号列>2cm）"
      0.75: "列宽分配正确但单元格内边距不符合规范（上下20dxa/左右40dxa）"
      1.0: "列宽智能分配完全正确：窄列(1.0-2.5cm)居中对齐 + 宽列(>=7cm)左对齐 + 内边距上下20dxa左右40dxa + 表格内行距1.0 + 表头加粗"
- key: "content_completeness"
  name: "内容完整性"
  weight: 0.35
  checks:
  - id: "completeness_9_modules"
    desc: "9个模块全部呈现，无遗漏"
    evidence_from:
      - "rules/031-export-word-pdf.md:步骤3 文档内容结构"
    levels:
      0.0: "缺少>3个模块，文档残缺不完整"
      0.25: "缺少2-3个模块（如缺添加剂安全清单或缺地域适配）"
      0.50: "9个模块名称均在但1-2个模块内容为空或过于简略"
      0.75: "9个模块均有实质性内容但速查卡不可独立打印（嵌入正文未单独设计）"
      1.0: "9个模块100%完整，均有实质性内容，速查卡可独立打印张贴，添加剂安全卡与GB 2760对照完整"
  - id: "completeness_cover_info"
    desc: "封面信息齐全：菜品名称 + 客户信息 + 核心参数"
    evidence_from:
      - "rules/031-export-word-pdf.md:步骤3 文档内容结构"
    levels:
      0.0: "无封面或封面仅有菜品名称"
      0.25: "封面有菜品名称但缺少客户信息或核心参数"
      0.50: "封面信息基本齐全但核心参数仅包含部分（如缺保存期或缺出餐速度）"
      0.75: "封面信息齐全但排版未独立成页（与正文混排）"
      1.0: "封面独立完整：菜品名称+客户信息+成本/出餐速度/保存期等核心商业参数一目了然"
- key: "printability"
  name: "可打印性"
  weight: 0.25
  checks:
  - id: "printability_a4_layout"
    desc: "A4排版合理，页边距1.0-1.2cm，无分页符"
    evidence_from:
      - "rules/031-export-word-pdf.md:步骤2 分页规则"
    levels:
      0.0: "使用了分页符强行分页"
      0.25: "无分页符但页边距过大（>1.5cm）导致可用空间浪费"
      0.50: "页边距合理但内容自然流排时出现大片空白"
      0.75: "A4排版可接受但分隔线未使用━替代空白行"
      1.0: "页边距1.0-1.2cm，无分页符，内容自然流排，分隔线使用━减少空白，打印预览效果良好"
  - id: "printability_no_metadata"
    desc: "无元数据泄漏：零'AI生成'等字样，文件路径和命名正确"
    evidence_from:
      - "rules/031-export-word-pdf.md:步骤2 内容规范"
      - "rules/031-export-word-pdf.md:步骤2 交付规则"
    levels:
      0.0: "文档含'AI生成''自动生成''人工智能'等禁止字样"
      0.25: "无AI字样但含'生成工具''生成日期'等元数据标注"
      0.50: "无任何元数据标注但文件命名不符规范"
      0.75: "元数据无泄漏且文件命名正确但未保存至~/Desktop/"
      1.0: "零元数据泄漏，文件名{菜品名}_{客户信息}_配方方案.docx，保存至~/Desktop/，生成脚本用后已删"
