---
rule_id: input-parse-sop
version: 0.1.0
description: 输入解析SOP产出物Gates检查
phase: building
---
context:
  purpose: 校验input-parse-sop规则产出物（SSOT定义、Gates配置、Rubric评分标准）的合规性与完整性
  scope: |
    本Gates配置覆盖三件套文件(SOT/Gates/Rubric)的：
    - 文件存在性与路径有效性
    - 结构合规性（YAML frontmatter、Gates schema、Rubric schema）
    - 内容完整性（必需字段、必需Gate、权重校验）
    - 领域特有约束（触发器定义、输入字段定义、行为描述）
  consumer: ssot-judge、Administrator
gates:
- id: gate0_assets
  name: 三件套文件存在性检查
  critical: true
  checks:
  - type: custom_script
    script_template: templates/gate-scripts/check_file_paths.py
    params:
      p1: ssot/recipe-generator/input-parse-sop-ssot.md
      p2: ops/recipe-generator/input-parse-sop-gates.yaml
      p3: ops/recipe-generator/input-parse-sop-rubric.yaml
- id: gate0_input_ssot_assets
  name: 输入SSOT三件套文件存在性检查
  critical: true
  checks:
  - type: custom_script
    script_template: templates/gate-scripts/check_file_paths.py
    params:
      p1: ssot/recipe-generator/recipe-generation-orchestrator-sop-ssot.md
      p2: ops/recipe-generator/recipe-generation-orchestrator-sop-gates.yaml
      p3: ops/recipe-generator/recipe-generation-orchestrator-sop-rubric.yaml
- id: gate1_ssot_frontmatter
  name: SSOT-YAML头必填字段检查
  critical: false
  checks:
  - type: custom_script
    script_template: templates/gate-scripts/check_yaml_frontmatter.py
    params:
      target_file: ssot/recipe-generator/input-parse-sop-ssot.md
      required_fields:
      - name
      - version
      - description
      - applies_to
      - deliverable_vision
      - deliverable_type
      - related_rule
      - configs
- id: gate2_gates_schema
  name: Gates-YAML结构合规检查
  critical: true
  checks:
  - type: custom_script
    script_template: templates/gate-scripts/check_yaml_schema.py
    params:
      target_file: ops/recipe-generator/input-parse-sop-gates.yaml
      required_keys:
      - context
      - gates
      - decision
- id: gate3_rubric_schema
  name: Rubric-YAML结构合规检查
  critical: true
  checks:
  - type: custom_script
    script_template: templates/gate-scripts/check_yaml_schema.py
    params:
      target_file: ops/recipe-generator/input-parse-sop-rubric.yaml
      required_keys:
      - scale
      - aggregation
      - rubric
- id: gate4_path_validity
  name: configs路径有效性检查
  critical: false
  checks:
  - type: custom_script
    script_template: templates/gate-scripts/check_config_paths.py
    params:
      target_file: ssot/recipe-generator/input-parse-sop-ssot.md
      path_keys:
      - configs.gates
      - configs.rubric
- id: gate5_required_gates
  name: 必需Gate齐全检查
  critical: true
  checks:
  - type: custom_script
    script_template: templates/gate-scripts/check_required_gates.py
    params:
      target_file: ops/recipe-generator/input-parse-sop-gates.yaml
      required_gates:
      - gate0_assets
      - gate0_input_ssot_assets
      - gate1_ssot_frontmatter
      - gate2_gates_schema
      - gate3_rubric_schema
      - gate4_path_validity
      - gate5_required_gates
      - gate6_weight_sum
      - gate7_eval_dataset
      - gate8_universal_gates_unchanged
      - gate10_trigger
      - gate10_input
      - gate10_behavior
      - gate10_output
      - gate10_acceptance
- id: gate6_weight_sum
  name: Rubric权重总和检查
  critical: false
  checks:
  - type: custom_script
    script_template: templates/gate-scripts/check_weight_sum.py
    params:
      target_file: ops/recipe-generator/input-parse-sop-rubric.yaml
      tolerance: 0.05
- id: gate7_eval_dataset
  name: 评测数据集检查
  critical: false
  checks:
  - type: custom_script
    script_template: templates/gate-scripts/check_eval_dataset.py
    params:
      base_dir: eval/recipe-generator/input-parse-sop
      min_cases: 3
- id: gate8_universal_gates_unchanged
  name: 通用Gates未修改检查
  critical: true
  checks:
  - type: custom_script
    script_template: templates/gate-scripts/check_universal_gates.py
    params:
      target_file: ops/recipe-generator/input-parse-sop-gates.yaml
      universal_gate_ids:
      - gate0_assets
      - gate0_input_ssot_assets
      - gate1_ssot_frontmatter
      - gate2_gates_schema
      - gate3_rubric_schema
      - gate4_path_validity
      - gate5_required_gates
      - gate6_weight_sum
      - gate7_eval_dataset
      - gate8_universal_gates_unchanged
      reference_file: ops/recipe-generator/input-parse-sop-gates.yaml
- id: gate10_trigger
  name: 触发器定义检查
  critical: true
  checks:
  - type: custom_script
    script_template: templates/gate-scripts/check_ssot_section.py
    params:
      target_file: ssot/recipe-generator/input-parse-sop-ssot.md
      section_keyword: WHEN
      required_phrases:
      - 触发
      - 用户输入
- id: gate10_input
  name: 必需输入字段检查
  critical: true
  checks:
  - type: custom_script
    script_template: templates/gate-scripts/check_ssot_section.py
    params:
      target_file: ssot/recipe-generator/input-parse-sop-ssot.md
      section_keyword: 必需输入
      required_phrases:
      - 菜品名称
      - 所在地区
      - 出餐场景
- id: gate10_behavior
  name: 解析行为描述检查
  critical: true
  checks:
  - type: custom_script
    script_template: templates/gate-scripts/check_ssot_section.py
    params:
      target_file: ssot/recipe-generator/input-parse-sop-ssot.md
      section_keyword: 行为
      required_phrases:
      - 解析
      - 标准化
- id: gate10_output
  name: 输出定义检查
  critical: false
  checks:
  - type: custom_script
    script_template: templates/gate-scripts/check_ssot_section.py
    params:
      target_file: ssot/recipe-generator/input-parse-sop-ssot.md
      section_keyword: 产出物定义
      required_phrases:
      - dish_name
      - region
      - scene
      - constraints
      - parse_meta
- id: gate10_acceptance
  name: 验收检查
  critical: false
  checks:
  - type: custom_script
    script_template: templates/gate-scripts/check_acceptance_items.py
    params:
      target_file: ssot/recipe-generator/input-parse-sop-ssot.md
      min_checklist_items: 6
      required_keywords:
      - YAML
      - frontmatter
      - CTA
      - critical gate
      - Rubric
decision:
  gate_pass_required: all_critical
  failure_action: block
  max_retry: 3
  critical_gates:
  - gate0_assets
  - gate0_input_ssot_assets
  - gate2_gates_schema
  - gate3_rubric_schema
  - gate5_required_gates
  - gate8_universal_gates_unchanged
  - gate10_trigger
  - gate10_input
  - gate10_behavior
