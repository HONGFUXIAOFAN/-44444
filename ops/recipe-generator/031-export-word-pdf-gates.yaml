---
rule_id: "031-export-word-pdf"
version: "0.1.0"
description: "031-导出Word/PDF 产出物Gates检查"
phase: "building"
---
context:
  purpose: "检查031-导出Word/PDF规则的产出物是否符合质量门禁标准，确保SSOT/Gates/Rubric三件套完整、结构合规、路径有效"
  scope: "ssot/recipe-generator/031-export-word-pdf-ssot.md, ops/recipe-generator/031-export-word-pdf-gates.yaml, ops/recipe-generator/031-export-word-pdf-rubric.yaml, rules/031-export-word-pdf.md"
  consumer: "ssot-judge、Administrator"
gates:
- id: "gate0_assets"
  name: "三件套存在检查"
  desc: "确认SSOT文件、Gates文件、Rubric文件全部存在"
  check: "check_file_paths.py"
  params:
    p1: "ssot/recipe-generator/031-export-word-pdf-ssot.md"
    p2: "ops/recipe-generator/031-export-word-pdf-gates.yaml"
    p3: "ops/recipe-generator/031-export-word-pdf-rubric.yaml"
  critical: true
- id: "gate0_input_ssot_assets"
  name: "三件套存在检查(alias)"
  desc: "同上，确认三件套存在"
  check: "check_file_paths.py"
  params:
    p1: "ssot/recipe-generator/031-export-word-pdf-ssot.md"
    p2: "ops/recipe-generator/031-export-word-pdf-gates.yaml"
    p3: "ops/recipe-generator/031-export-word-pdf-rubric.yaml"
  critical: true
- id: "gate1_ssot_frontmatter"
  name: "SSOT YAML头完整性检查"
  desc: "确认SSOT文件YAML frontmatter包含必填字段: name, version, description, applies_to, deliverable_vision, configs"
  check: "check_yaml_structure.py"
  params:
    target: "ssot/recipe-generator/031-export-word-pdf-ssot.md"
    required_fields:
      - "name"
      - "version"
      - "description"
      - "applies_to"
      - "deliverable_vision"
      - "configs"
  critical: false
- id: "gate2_gates_schema"
  name: "Gates文件结构校验"
  desc: "确认Gates YAML文件包含必选字段: context, gates, decision"
  check: "check_yaml_structure.py"
  params:
    target: "ops/recipe-generator/031-export-word-pdf-gates.yaml"
    required_fields:
      - "context"
      - "gates"
      - "decision"
  critical: true
- id: "gate3_rubric_schema"
  name: "Rubric文件结构校验"
  desc: "确认Rubric YAML文件包含必选字段: scale, aggregation, rubric"
  check: "check_yaml_structure.py"
  params:
    target: "ops/recipe-generator/031-export-word-pdf-rubric.yaml"
    required_fields:
      - "scale"
      - "aggregation"
      - "rubric"
  critical: true
- id: "gate4_path_validity"
  name: "configs路径有效性检查"
  desc: "确认SSOT中configs路径指向的文件真实存在"
  check: "check_configs_paths.py"
  critical: false
- id: "gate5_required_gates"
  name: "必选Gate存在检查"
  desc: "确认所有必选gate ID均已定义"
  check: "check_required_gates.py"
  params:
    required_gates:
      - "gate0_assets"
      - "gate1_ssot_frontmatter"
      - "gate2_gates_schema"
      - "gate3_rubric_schema"
      - "gate4_path_validity"
      - "gate5_required_gates"
      - "gate6_weight_sum"
      - "gate7_eval_dataset"
      - "gate8_universal_gates_unchanged"
      - "gate10_trigger"
      - "gate10_input"
      - "gate10_behavior"
      - "gate10_output"
      - "gate10_acceptance"
  critical: true
- id: "gate6_weight_sum"
  name: "Rubric权重总和检查"
  desc: "确认Rubric维度权重总和接近1.0（容差0.05）"
  check: "check_rubric_weight_sum.py"
  params:
    target: "ops/recipe-generator/031-export-word-pdf-rubric.yaml"
    tolerance: 0.05
  critical: false
- id: "gate7_eval_dataset"
  name: "评测数据集检查"
  desc: "确认评测数据集目录存在且至少包含3条用例"
  check: "check_eval_dataset.py"
  params:
    base_dir: "eval/recipe-generator/031-export-word-pdf"
    min_cases: 3
  critical: false
- id: "gate8_universal_gates_unchanged"
  name: "通用Gate未修改检查"
  desc: "确认gate0-gate8通用gate定义与标准模板一致，未被篡改"
  check: "check_universal_gates.py"
  critical: true
- id: "gate10_trigger"
  name: "领域触发器检查"
  desc: "确认触发器条件匹配: 030-用户审查确认流程全部通过后"
  critical: true
- id: "gate10_input"
  name: "领域输入检查"
  desc: "确认输入要素完整: 030规则产出且用户已逐项确认的完整配方方案 + 审查通过标志"
  critical: true
- id: "gate10_behavior"
  name: "领域行为检查"
  desc: "确认行为逻辑完整: 步骤1确认导出格式 -> 步骤2生成文档（python-docx，字体/配色/列宽/边距强制执行） -> 步骤3文档内容9模块结构 -> 步骤4交付确认"
  critical: true
- id: "gate10_output"
  name: "领域输出检查"
  desc: "确认输出物完整: Word(.docx) + PDF(.pdf) + 交付确认（文件路径+使用建议）"
  critical: true
- id: "gate10_acceptance"
  name: "领域验收检查"
  desc: "确认验收标准: 9模块完整 + 无"AI生成"等元数据 + 无分页符 + 字体适配手机 + 速查卡可独立打印 + 文件保存至~/Desktop/"
  critical: false
decision:
  gate_pass_required: "all_critical"
  failure_action: "block"
  max_retry: 3
  critical_gates:
    - "gate0_assets"
    - "gate0_input_ssot_assets"
    - "gate2_gates_schema"
    - "gate3_rubric_schema"
    - "gate5_required_gates"
    - "gate8_universal_gates_unchanged"
    - "gate10_trigger"
    - "gate10_input"
    - "gate10_behavior"
    - "gate10_output"
